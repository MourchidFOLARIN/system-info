[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-info"
version = "1.0.0"
description = "Outil de diagnostic et d'information système"
requires-python = ">=3.10"
dependencies = [
    "psutil",
    "rich"
]

[project.scripts]
systeme = "run:get_system_info"

[tool.setuptools]
py-modules = ["run"]
